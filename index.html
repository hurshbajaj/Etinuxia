<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Etinuxia, the orbital archive of myth</title>
    <meta name="description" content="Etinuxia watches Earth from orbit and records its myths: the gods, the creatures and the folklore of every region.">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='42' fill='%23000'/%3E%3Ccircle cx='50' cy='50' r='42' fill='none' stroke='%23fff' stroke-width='6'/%3E%3C/svg%3E">
    <link rel="preload" href="assets/fonts/Satoshi-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/Satoshi-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/Satoshi-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="styles/fonts.css">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/stage.css">
    <link rel="stylesheet" href="styles/interface.css">
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main class="stage" data-stage aria-label="Etinuxia observation deck">
      <div class="stage__frame">
        <img class="stage__still" data-still alt="">
        <video class="stage__ambient" data-ambient muted playsinline loop preload="auto" disablepictureinpicture disableremoteplayback></video>
        <video class="stage__clip" data-clip muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>
        <div class="hotspots" data-hotspots></div>
      </div>
      <div class="stage__shade" aria-hidden="true"></div>
    </main>

    <header class="masthead">
      <p class="wordmark">Etinuxia</p>
      <nav class="sections" aria-label="Instruments" data-sections></nav>
    </header>

    <section class="copy" data-copy aria-live="polite">
      <h1 class="copy__title" data-copy-title tabindex="-1"></h1>
      <dl class="copy__facts" data-copy-facts></dl>
      <p class="copy__body" data-copy-body></p>
      <button class="copy__back" type="button" data-copy-back hidden></button>
      <button class="copy__etidex" type="button" data-copy-etidex hidden>Etidex</button>
    </section>

    <nav class="rail" aria-label="Stops">
      <ol class="rail__list" data-rail></ol>
    </nav>

    <p class="hint" data-hint aria-hidden="true"><span class="hint__line"></span>Scroll to board the deck</p>

    <div class="loader" data-loader role="progressbar" aria-label="Loading the deck" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <p class="loader__mark">Etinuxia</p>
      <span class="loader__track"><span class="loader__fill" data-loader-fill></span></span>
      <p class="loader__status" data-loader-status>Loading the deck</p>
    </div>

    <noscript><p class="noscript">Etinuxia needs JavaScript to run the deck.</p></noscript>
  </body>
</html>
